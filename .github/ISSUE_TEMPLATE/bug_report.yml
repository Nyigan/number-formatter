name: Bug report
description: Something formats or parses wrongly, or throws when it should not
labels: [bug]
body:
  - type: textarea
    id: code
    attributes:
      label: What did you run?
      description: The smallest call that shows the problem, with the exact locale and options.
      placeholder: "format.parse('1.234,5', 'de-DE', { style: 'currency', currency: 'EUR' })"
      render: js
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node version or browser
      description: "Run `node -p \"process.version + ' ICU ' + process.versions.icu + ' CLDR ' + process.versions.cldr\"`. Locale data differs between versions, which can change results."
      placeholder: "v22.12.0 ICU 76.1 CLDR 46.0"
    validations:
      required: true
